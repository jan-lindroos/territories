[build-system]
requires = ["setuptools>=64", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "territories"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["torch", "tqdm", "numpy"]

[project.scripts]
territories = "cli:main"

[tool.setuptools]
py-modules = ["cli", "ui", "simulation"]
packages = ["train"]

[tool.setuptools.package-dir]
"" = "src"
